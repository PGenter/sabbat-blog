<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="src/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DownUnder-Blog - Passwort zurücksetzen</title>
</head>

<body>
  <div class="main_wrapper">
    <div id="modal-backdrop" class="modal-backdrop active"></div>
    <div class="map_wrapper">
      <img style="width: 100%; height: 100%; object-fit: cover;" src="public/assets/login-bg.png" alt="">
      <!-- <div id="map" class="map-container"></div> -->
    </div>
    <div class="login_wrapper" id="login_wrapper">
      <div class="card login-cd glassy modal" id="login-section">
        <div class="card-head">
          <h2>Passwort zurücksetzen</h2>
          <div class="reset-link">
            <button class="close-button" id="close-button">X</button>
            <!-- <a href="index.html" title="Zurück">X</a> -->
          </div>
        </div>
        <form id="reset-form" class="lg-button-container">
          <input type="email" id="email" placeholder="Email" required />
          <div class="lg-button-container">
            
          <button type="submit" class="nav-button lg-button" id="reset" title="Reset-Link senden"><i
              class="bi bi-key"></i>Reset-Link senden</button>
            </div>
        </form>
        <div id="message" class="msg-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/page/reset-request.ts"></script>
</body>

</html>
