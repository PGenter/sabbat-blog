<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/KoalaKiwiCocoFavi.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Koala, Kiwi and Coconut" />
  <meta name="theme-color" content="#f5f4ee" />
  <link rel="stylesheet" href="src/theme.css">
  <link rel="stylesheet" href="src/auth.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Koala, Kiwi and Coconut - Passwort zurücksetzen</title>
</head>

<body>
  <div class="auth-bg" aria-hidden="true">
    <img src="assets/login-bg.webp" alt="">
  </div>

  <button class="auth-lang" id="language-toggle" type="button" title="Sprache wechseln">
    <img src="/assets/lang/de-20.png" srcset="/assets/lang/de-40.png 2x" width="20" alt="Deutsch" />
  </button>

  <main class="auth-shell">
    <section class="auth-card" id="login-section">
      <button class="auth-close" id="close-button" type="button"><i class="bi bi-x-lg"></i></button>
      <header class="auth-card__head">
        <img class="auth-card__logo" src="/KoalaKiwiCocoFavi.png" alt="Koala, Kiwi and Coconut Logo" />
        <h2>Passwort zurücksetzen</h2>
      </header>
      <form id="reset-form" class="auth-form">
        <input type="email" id="email" placeholder="Email" autocomplete="email" required />
        <button type="submit" class="auth-button" id="reset" title="Reset-Link senden">
          <i class="bi bi-key"></i>Reset-Link senden
        </button>
      </form>
      <div id="message" class="msg-container" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="/src/page/reset-request.ts"></script>
</body>

</html>
