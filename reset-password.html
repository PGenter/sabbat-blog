<!doctype html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/KoalaKiwiCocoFavi.png" />
    <link rel="apple-touch-icon" href="/KoalaKiwiCocoFavi.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Koala, Kiwi and Coconut" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koala, Kiwi and Coconut - Neues Passwort setzen</title>
</head>

<body>
    <div class="main_wrapper">
        <div id="modal-backdrop" class="modal-backdrop active"></div>
        <div class="map_wrapper">
            <img style="width: 100%; height: 100%; object-fit: cover;" src="assets/login-bg.png" alt="">
        </div>
        <div class="login_container" id="map-section">
            <div class="button_container">
                <button class="nav-button rnd-button glassy" id="language-toggle" title="Sprache wechseln">
                    <img src="https://flagcdn.com/w20/de.png" srcset="https://flagcdn.com/w40/de.png 2x" width="20" alt="Deutsch" />
                </button>
            </div>
            <div class="login_wrapper" id="login_wrapper">
                <div class="card upload-cd glassy modal" id="login-section">
                    <div class="card-head">
                        <h2>Neues Passwort setzen</h2>
                        <div class="app_logo">
                            <img src="/KoalaKiwiCocoFavi.png" alt="Koala, Kiwi and Coconut Logo" />
                        </div>
                    </div>
                    <div class="modal-container">
                        <form id="new-password-form" class="lg-button-container">
                            <input type="text" id="username" name="username" autocomplete="username"
                                style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0;"
                                tabindex="-1" aria-hidden="true" />
                            <input type="password" id="password" placeholder="Neues Passwort" autocomplete="new-password" required />
                            <input type="password" id="confirm-password" placeholder="Neues Passwort bestätigen" autocomplete="new-password" required />
                            <div class="lg-button-container">

                                <ul id="password-rules">
                                    <li id="rule-length">Mindestens 8 Zeichen</li>
                                    <li id="rule-letter">Mindestens ein Buchstabe</li>
                                    <li id="rule-number">Mindestens eine Zahl</li>
                                    <li id="rule-special">Mindestens ein Sonderzeichen</li>
                                    <li id="rule-match">Passwörter stimmen überein</li>
                                </ul>
                                <button type="submit" class="nav-button lg-button" title="Neues Passwort setzen">Passwort
                                    setzen</button>
                                </div>
                        </form>
                        <div id="message" class="msg-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/page/reset-password.ts"></script>
</body>

</html>
