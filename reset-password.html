<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/KoalaKiwiCocoFavi.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Koala, Kiwi and Coconut" />
  <meta name="theme-color" content="#f5f4ee" />
  <link rel="stylesheet" href="src/theme.css">
  <link rel="stylesheet" href="src/auth.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Koala, Kiwi and Coconut - Neues Passwort setzen</title>
</head>

<body>
  <div class="auth-bg" aria-hidden="true">
    <img src="assets/login-bg.webp" alt="">
  </div>

  <button class="auth-lang" id="language-toggle" type="button" title="Sprache wechseln">
    <img src="/assets/lang/de-20.png" srcset="/assets/lang/de-40.png 2x" width="20" alt="Deutsch" />
  </button>

  <main class="auth-shell">
    <section class="auth-card" id="login-section">
      <header class="auth-card__head">
        <img class="auth-card__logo" src="/KoalaKiwiCocoFavi.png" alt="Koala, Kiwi and Coconut Logo" />
        <h2>Neues Passwort setzen</h2>
      </header>
      <form id="new-password-form" class="auth-form">
        <input type="text" id="username" name="username" autocomplete="username"
          style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0;"
          tabindex="-1" aria-hidden="true" />
        <input type="password" id="password" placeholder="Neues Passwort" autocomplete="new-password" required />
        <input type="password" id="confirm-password" placeholder="Neues Passwort bestätigen"
          autocomplete="new-password" required />
        <ul id="password-rules">
          <li id="rule-length">Mindestens 8 Zeichen</li>
          <li id="rule-letter">Mindestens ein Buchstabe</li>
          <li id="rule-number">Mindestens eine Zahl</li>
          <li id="rule-special">Mindestens ein Sonderzeichen</li>
          <li id="rule-match">Passwörter stimmen überein</li>
        </ul>
        <button type="submit" class="auth-button" title="Neues Passwort setzen">Passwort setzen</button>
      </form>
      <div id="message" class="msg-container" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="/src/page/reset-password.ts"></script>
</body>

</html>
