<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sabbat-blog</title>

<body>
  <div class="main_wrapper">
    <div class="map_wrapper">
      <div id="map-filter" class="map-filter"></div>
      <div id="map" class="map-container"></div>
    </div>
    <div class="login_wrapper" id="login_wrapper">
      <div class="card_wrapper glassy" id="login-section">
        <h2>Login erforderlich</h2>
        <form id="login-form">
          <input type="email" id="email" placeholder="Email" required />
          <input type="password" id="password" placeholder="Passwort" required />
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
    <div class="interface_wrapper" style="display:none;" id="map-section">
      <div class="card_container">
        <div class="card_wrapper glassy" id="country-card">
          <h2>Karte</h2>
        </div>
        <div class="button_wrapper" id="button_wrapper">
          <button class="nav-button glassy" id="logout" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
        </div>
      </div>
      <div class="nav_wrapper">
        <div class="navbar_wrapper " id="navbar">
          <div class="slider-track" id="slider-track">
            <div class="slider-progress" id="slider-progress"></div>
            <div class="slider-handle" id="slider-handle"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>

</body>

</html>
